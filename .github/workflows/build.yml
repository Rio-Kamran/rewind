# Builds Rewind.exe with the compiler that ships in Windows, runs the tests, keeps the exe as an
# artifact on every push, and attaches it to a GitHub Release whenever a v* tag is pushed.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: Rewind
          path: Rewind.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Rewind.exe
          generate_release_notes: true
